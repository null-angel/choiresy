[package]
name = "choiresy"
version = "0.1.0"
edition = "2024"
description = "A desktop library for community-owned AI music"
license = "MIT"

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tray-icon = { version = "0.27", default-features = false, features = ["ksni"] }
